name: Publish

# Publishes to npm on every push to main whose package.json version is not on
# the registry yet. To release: bump the version (`npm version patch`), merge
# to main. A push that does not change the version publishes nothing.
#
# Authentication is npm trusted publishing (OIDC): there is no npm token in
# this repository. The package's settings on npmjs.com must list this
# repository and this workflow file (publish.yml) as a trusted publisher.

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing and provenance

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check if version already published
        id: version_check
        run: |
          NAME=$(node -p "require('./package.json').name")
          CURRENT=$(node -p "require('./package.json').version")
          # `npm view` fails for a package that does not exist (and still
          # prints an error body), so the exit status is what tells.
          if ! PUBLISHED=$(npm view "$NAME" versions --json 2>/dev/null); then
            # Trusted publishing is configured per package, so the package has
            # to exist first: the very first release is published by hand.
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME is not on npm yet — the first release is published manually."
          elif echo "$PUBLISHED" | grep -q "\"$CURRENT\""; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version $CURRENT already published — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Publishing $CURRENT"
          fi

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: Publish to npm
        if: steps.version_check.outputs.skip == 'false'
        run: |
          npm install -g npm@latest
          npm publish --access public --provenance --ignore-scripts
